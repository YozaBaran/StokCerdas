<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StokCerdas — AI-Powered Inventory & Food Waste Management untuk UMKM</title>
  <meta name="description" content="Platform manajemen stok dan pencegahan food waste berbasis AI untuk UMKM Kuliner dan Retail Pangan di Indonesia.">
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body class="app-body">

  <!-- App Layout Container -->
  <div id="app-root" class="app-layout">
    
    <!-- Sidebar Component Container -->
    <aside id="sidebar-container" class="sidebar-wrapper"></aside>

    <!-- Main Content Area -->
    <div class="main-wrapper">
      
      <!-- Topbar / Header Container -->
      <header id="header-container" class="header-wrapper"></header>

      <!-- Main Dynamic Content Container -->
      <main id="content-container" class="content-body">
        <!-- Dynamic page views injected here -->
      </main>

      <!-- App Footer -->
      <footer class="app-footer">
        <div class="footer-left">
          <span>&copy; 2026 <strong>StokCerdas</strong> — AI-Powered Inventory & Waste Rescue Platform</span>
        </div>
        <div class="footer-right">
          <span class="badge badge-emerald"><i data-lucide="leaf"></i> Zero Waste Target</span>
          <span class="badge badge-teal"><i data-lucide="sparkles"></i> AI Reorder Active</span>
        </div>
      </footer>
    </div>
  </div>

  <!-- Universal Modal Root -->
  <div id="modal-container" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title" class="modal-title">Judul Modal</h3>
        <button id="modal-close-btn" class="icon-btn" aria-label="Tutup"><i data-lucide="x"></i></button>
      </div>
      <div id="modal-body" class="modal-body">
        <!-- Modal content injected dynamically -->
      </div>
    </div>
  </div>

  <!-- Notification Drawer Root -->
  <div id="notification-drawer" class="notification-drawer hidden">
    <div class="drawer-header">
      <div class="drawer-title-box">
        <i data-lucide="bell" class="icon-emerald"></i>
        <h3>Pusat Notifikasi</h3>
      </div>
      <button id="close-notifications-btn" class="icon-btn"><i data-lucide="x"></i></button>
    </div>
    <div class="drawer-actions">
      <button id="mark-all-read-btn" class="btn btn-sm btn-ghost">Tandai Semua Dibaca</button>
      <button id="clear-notifications-btn" class="btn btn-sm btn-ghost text-muted">Bersihkan</button>
    </div>
    <div id="notification-list" class="notification-list">
      <!-- Notification items injected dynamically -->
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Application Logic Modules -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
